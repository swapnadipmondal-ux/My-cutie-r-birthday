<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pieces of us</title>
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@1,400;1,600&family=Great+Vibes&display=swap" rel="stylesheet">
</head>
<body>

  <div class="bg-vignette"></div>
  <div class="stars-container" id="starsContainer"></div>

  <main class="wrapper">
    <h1 class="title">Pieces of us</h1>

    <div class="gallery-grid">
      <div class="card">
        <div class="img-wrapper">
          <img src="pic1.jpg" alt="Your smile" class="card-img">
        </div>
        <p class="caption">Your smile.</p>
      </div>

      <div class="card">
        <div class="img-wrapper">
          <img src="pic2.jpg" alt="My favourite person" class="card-img">
        </div>
        <p class="caption">My favourite person.</p>
      </div>

      <div class="card">
        <div class="img-wrapper">
          <img src="pic3.jpg" alt="Our little world" class="card-img">
        </div>
        <p class="caption">Our little world.</p>
      </div>

      <div class="card">
        <div class="img-wrapper">
          <img src="pic4.jpg" alt="My Titli" class="card-img">
        </div>
        <p class="caption">My 'Titli'.</p>
      </div>
    </div>

    <div class="action-bar">
      <button id="musicBtn" class="btn">♫ music off</button>
      <button class="btn">more</button>
    </div>
  </main>

  <script src="song.js"></script>
</body>
</html>
